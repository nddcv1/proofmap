[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proofmap"
version = "0.1.0"
description = "Evidence-backed prerequisite graphs for informal math textbooks and notes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
proofmap = "proofmap.cli:main"

[tool.setuptools.packages.find]
include = ["proofmap*"]

[tool.setuptools.package-data]
proofmap = ["render/*.html", "render/vendor/*.js"]
